[project]
name = "paid-ads-mcp-meta-ads"
version = "0.5.0"
description = "MCP server that wraps Meta's official `meta ads` CLI so Claude can read and manage a Meta ad account."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.2.0",
  # Local video transcription. Skipped on Intel Macs: faster-whisper requires
  # onnxruntime (Silero VAD), which ships no macOS x86_64 wheel — as a hard
  # dep it would fail `uv sync` and take the whole MCP server down with it.
  # Excluded there so those machines get a working plugin; ad_video_get
  # degrades to video + keyframes + saved audio. See README.
  # (PEP 508 markers have no boolean `not`, so this is the De Morgan form of
  # "not (darwin and x86_64)".)
  "faster-whisper>=1.2.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
paid-ads-mcp-meta-ads = "mcp_meta_ads.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_meta_ads"]
