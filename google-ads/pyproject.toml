[project]
name = "paid-ads-mcp-google-ads"
version = "1.0.0"
description = "MCP server exposing the Google Ads API so Claude can query and manage an account."
requires-python = ">=3.11"
dependencies = [
  # `mcp.server.fastmcp` is the vendored FastMCP module that mcp 2.0 dropped,
  # so hold the 1.x line until the server migrates to the standalone package.
  "mcp[cli]>=1.3.0,<2",
  "google-auth>=2.25.2",
  "google-auth-oauthlib>=1.2.1",
  "requests>=2.31.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
paid-ads-mcp-google-ads = "mcp_google_ads.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_google_ads"]
