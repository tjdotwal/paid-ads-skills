[project]
name = "mcp-keyword-planner"
version = "2.0.0"
description = "MCP server exposing Google Ads Keyword Planner so Claude can research keywords, validate search volume, and forecast performance."
requires-python = ">=3.11"
dependencies = [
  # `mcp.server.fastmcp` is the vendored FastMCP module that mcp 2.0 dropped,
  # so hold the 1.x line to match the sibling Google Ads plugin.
  "mcp[cli]>=1.3.0,<2",
  "google-auth>=2.25.2",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-keyword-planner = "mcp_keyword_planner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_keyword_planner"]
